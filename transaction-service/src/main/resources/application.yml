server:
  port: 8084

spring:
  application:
    name: transaction-service
  web:
    # validation messages follow the client's Accept-Language or the server locale unless fixed
    locale: en
    locale-resolver: fixed
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # the shard addresses in sharding.yaml come from the same environment variables as transaction.shards
    url: jdbc:shardingsphere:classpath:sharding.yaml?placeholder-type=environment
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # TIMESTAMP columns have no zone: Instant is stored as UTC, not as the server clock
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP

transaction:
  shards:
    - url: ${TRANSACTION_SHARD_0_URL:jdbc:postgresql://localhost:5435/transaction}
      username: ${TRANSACTION_DB_USER:transaction}
      password: ${TRANSACTION_DB_PASSWORD:transaction}
    - url: ${TRANSACTION_SHARD_1_URL:jdbc:postgresql://localhost:5436/transaction}
      username: ${TRANSACTION_DB_USER:transaction}
      password: ${TRANSACTION_DB_PASSWORD:transaction}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  tracing:
    sampling:
      # every request is traced - fine locally, not for production
      probability: 1.0
  otlp:
    metrics:
      export:
        # off: Prometheus scrapes the metrics; an OTLP push would only log failures
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
