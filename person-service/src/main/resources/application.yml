server:
  port: 8082

spring:
  application:
    name: person-service
  datasource:
    url: jdbc:postgresql://${PERSON_DB_HOST:localhost}:${PERSON_DB_PORT:5434}/${PERSON_DB_NAME:person}
    username: ${PERSON_DB_USER:person}
    password: ${PERSON_DB_PASSWORD:person}
  flyway:
    # the history lives next to the tables; without it Flyway follows search_path,
    # and "$user" = person points to public before V001 and to person after it
    default-schema: person
  jpa:
    # entities are loaded only inside service transactions, never while the response is written
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it
      ddl-auto: validate
    properties:
      # entities keep time as Instant (a point in time, independent of the server zone);
      # TIMESTAMP columns carry no zone, so it is written and read as UTC
      hibernate.jdbc.time_zone: UTC
      # Instant fields map to the plain TIMESTAMP columns of the DDL, not timestamptz
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      # Envers history: schema person_history, tables <table>_history (V005)
      org.hibernate.envers.default_schema: person_history
      org.hibernate.envers.audit_table_suffix: _history
      org.hibernate.envers.revision_field_name: revision
      org.hibernate.envers.revision_type_field_name: revision_type
      # *_mod flag named after the column (first_name_mod), not the Java field
      org.hibernate.envers.modified_column_naming_strategy: improved
      org.hibernate.envers.modified_flag_suffix: _mod
      # a deleted user keeps its data in the last revision, not only the id
      org.hibernate.envers.store_data_at_delete: true
