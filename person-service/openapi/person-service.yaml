openapi: 3.0.3

info:
  title: person-service
  description: |
    Source of truth for individuals. An individual is the aggregate root: it holds
    its user account (email, name), and the user holds the address.
    Create, update and delete are atomic for the whole aggregate.
  version: 3.0.0
  contact:
    name: dezxxx
    email: web7tudio@gmail.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8082
    description: Local
  - url: http://person-service:8082
    description: Docker network

tags:
  - name: individuals
    description: Individual aggregate - individual + user + address

paths:

  /api/v1/individuals:
    post:
      tags: [individuals]
      operationId: createIndividual
      summary: Create an individual with its user and address in one transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndividualRequest"
            examples:
              full:
                value:
                  passportNumber: "123456789"
                  phoneNumber: "+380441234567"
                  user:
                    email: ivan.petrov@example.org
                    firstName: Ivan
                    lastName: Petrov
                    address:
                      countryAlpha3: UKR
                      countryAlpha2: UA
                      city: Kyiv
                      state: Kyiv
                      zipCode: "01001"
                      addressLine: 1 Example St.
      responses:
        "201":
          description: Individual created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/individuals/{id}:
    parameters:
      - $ref: "#/components/parameters/IndividualId"
    get:
      tags: [individuals]
      operationId: getIndividualById
      summary: Get the whole individual aggregate
      responses:
        "200":
          description: Individual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [individuals]
      operationId: updateIndividual
      summary: Partially update the aggregate - only the fields sent are changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIndividualRequest"
            examples:
              rename-and-move:
                value:
                  phoneNumber: "+380441234568"
                  user:
                    firstName: Ivan
                    lastName: Petrov-Senior
                    address:
                      city: Lviv
      responses:
        "200":
          description: Individual after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [individuals]
      operationId: deleteIndividual
      summary: Soft delete - the individual becomes ARCHIVED, its data stays, it is no longer found
      responses:
        "204":
          description: Individual archived
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/individuals/compensate-registration/{id}:
    parameters:
      - $ref: "#/components/parameters/IndividualId"
    delete:
      tags: [individuals]
      operationId: compensateRegistration
      summary: Hard delete of the whole aggregate - undoes a registration that failed after this step
      responses:
        "204":
          description: Individual, its user and address deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/individuals/by-email:
    get:
      tags: [individuals]
      operationId: getIndividualByEmail
      summary: Find an individual by the email of its user, case-insensitive
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
            maxLength: 1024
          example: ivan.petrov@example.org
      responses:
        "200":
          description: Individual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  parameters:
    IndividualId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 7fd6212d-0f71-42a0-bf6e-7dbce6cf04fb

  schemas:

    CreateIndividualRequest:
      type: object
      required: [passportNumber, phoneNumber, user]
      properties:
        passportNumber:
          type: string
          minLength: 1
          maxLength: 32
          example: "123456789"
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 32
          example: "+380441234567"
        user:
          type: object
          required: [email, firstName, lastName, address]
          properties:
            email:
              type: string
              format: email
              maxLength: 1024
              example: ivan.petrov@example.org
            firstName:
              type: string
              minLength: 1
              maxLength: 64
              example: Ivan
            lastName:
              type: string
              minLength: 1
              maxLength: 64
              example: Petrov
            address:
              type: object
              required: [countryAlpha3, city, addressLine]
              properties:
                countryAlpha3:
                  type: string
                  minLength: 3
                  maxLength: 3
                  example: UKR
                countryAlpha2:
                  type: string
                  minLength: 2
                  maxLength: 2
                  example: UA
                city:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: Kyiv
                state:
                  type: string
                  maxLength: 64
                  example: Kyiv
                zipCode:
                  type: string
                  maxLength: 32
                  example: "01001"
                addressLine:
                  type: string
                  minLength: 1
                  maxLength: 128
                  example: 1 Example St.

    UpdateIndividualRequest:
      type: object
      properties:
        passportNumber:
          type: string
          minLength: 1
          maxLength: 32
          example: "123456789"
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 32
          example: "+380441234568"
        # email is not here: it is the login and is not changed by PATCH
        user:
          type: object
          properties:
            firstName:
              type: string
              minLength: 1
              maxLength: 64
              example: Ivan
            lastName:
              type: string
              minLength: 1
              maxLength: 64
              example: Petrov-Senior
            address:
              type: object
              properties:
                countryAlpha3:
                  type: string
                  minLength: 3
                  maxLength: 3
                  example: UKR
                countryAlpha2:
                  type: string
                  minLength: 2
                  maxLength: 2
                  example: UA
                city:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: Lviv
                state:
                  type: string
                  maxLength: 64
                  example: Lviv
                zipCode:
                  type: string
                  maxLength: 32
                  example: "79000"
                addressLine:
                  type: string
                  minLength: 1
                  maxLength: 128
                  example: 2 Example St.

    IndividualResponse:
      type: object
      required: [id, passportNumber, phoneNumber, status, createdAt, updatedAt, user]
      properties:
        id:
          type: string
          format: uuid
          example: 7fd6212d-0f71-42a0-bf6e-7dbce6cf04fb
        passportNumber:
          type: string
          example: "123456789"
        phoneNumber:
          type: string
          example: "+380441234567"
        status:
          type: string
          enum: [NEW, VERIFIED, ARCHIVED]
          example: NEW
        createdAt:
          type: string
          format: date-time
          example: "2026-06-08T10:15:30Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-08T10:15:30Z"
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        archivedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        user:
          type: object
          required: [id, email, firstName, lastName, filled, createdAt, updatedAt, address]
          properties:
            id:
              type: string
              format: uuid
              example: 6c8ec4d0-6fd5-4db8-bf4d-7bcbdb2f6c02
            email:
              type: string
              format: email
              example: ivan.petrov@example.org
            firstName:
              type: string
              example: Ivan
            lastName:
              type: string
              example: Petrov
            filled:
              type: boolean
              example: true
            createdAt:
              type: string
              format: date-time
              example: "2026-06-08T10:15:30Z"
            updatedAt:
              type: string
              format: date-time
              example: "2026-06-08T10:15:30Z"
            address:
              type: object
              required: [id, countryAlpha3, countryAlpha2, city, addressLine]
              properties:
                id:
                  type: string
                  format: uuid
                  example: 6e6d5e5e-5c7d-4f0e-9f9a-34a0b3f8d101
                countryAlpha3:
                  type: string
                  example: UKR
                countryAlpha2:
                  type: string
                  example: UA
                city:
                  type: string
                  example: Kyiv
                state:
                  type: string
                  example: Kyiv
                zipCode:
                  type: string
                  example: "01001"
                addressLine:
                  type: string
                  example: 1 Example St.

    ProblemResponse:
      type: object
      description: >
        RFC 9457 problem details. The last four fields are extension members shared by
        every service of the platform (individuals-api uses the same names), so one
        error body reads the same everywhere.
      required: [type, title, status, detail, instance, timestamp, error, traceId, details]
      properties:
        type:
          type: string
          format: uri
          example: https://example.org/problems/email-already-exists
        title:
          type: string
          description: Short summary of the HTTP status
          example: Conflict
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
          example: An individual with this email already exists
        instance:
          type: string
          example: /api/v1/individuals
        timestamp:
          type: string
          format: date-time
          example: "2026-06-08T10:15:30Z"
        error:
          type: string
          description: Stable machine-readable error code
          example: EMAIL_ALREADY_EXISTS
        traceId:
          type: string
          description: Correlates the response with the trace stored in Tempo
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        details:
          type: array
          description: Field-level failures, one readable line each; empty otherwise
          items:
            type: string
          example: []

  responses:
    BadRequest:
      description: Invalid format or failed validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    NotFound:
      description: Individual not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    Conflict:
      description: Email already taken, or the individual was changed by someone else meanwhile
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    InternalServerError:
      description: Unexpected error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
