openapi: 3.0.3

info:
  title: person-service
  description: |
    Source of truth for the user aggregate: user + address + individual data.
    Create, update and delete are atomic for the whole aggregate.
  version: 2.0.0
  contact:
    name: dezxxx
    email: web7tudio@gmail.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8082
    description: Local
  - url: http://person-service:8082
    description: Docker network

tags:
  - name: users
    description: User aggregate

paths:

  /api/v1/users:
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user with address and individual data in one transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            examples:
              full:
                value:
                  email: ivan.petrov@example.org
                  firstName: Ivan
                  lastName: Petrov
                  address:
                    countryAlpha3: UKR
                    countryAlpha2: UA
                    city: Kyiv
                    state: Kyiv
                    zipCode: "01001"
                    addressLine: 1 Example St.
                  individual:
                    passportNumber: "123456789"
                    phoneNumber: "+380441234567"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUserById
      summary: Get the whole user aggregate
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [users]
      operationId: updateUser
      summary: Partially update the aggregate - only the fields sent are changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            examples:
              rename-and-move:
                value:
                  firstName: Ivan
                  lastName: Petrov-Senior
                  address:
                    city: Lviv
      responses:
        "200":
          description: User after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete the whole aggregate in one transaction
      responses:
        "204":
          description: User deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/by-email:
    get:
      tags: [users]
      operationId: getUserByEmail
      summary: Find a user by email, case-insensitive
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
            maxLength: 1024
          example: ivan.petrov@example.org
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 6c8ec4d0-6fd5-4db8-bf4d-7bcbdb2f6c02

  schemas:

    CreateUserRequest:
      type: object
      required: [email, firstName, lastName, address, individual]
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
          example: ivan.petrov@example.org
        firstName:
          type: string
          minLength: 1
          maxLength: 64
          example: Ivan
        lastName:
          type: string
          minLength: 1
          maxLength: 64
          example: Petrov
        address:
          type: object
          required: [city, addressLine]
          properties:
            countryAlpha3:
              type: string
              minLength: 3
              maxLength: 3
              example: UKR
            countryAlpha2:
              type: string
              minLength: 2
              maxLength: 2
              example: UA
            city:
              type: string
              minLength: 1
              maxLength: 64
              example: Kyiv
            state:
              type: string
              maxLength: 64
              example: Kyiv
            zipCode:
              type: string
              maxLength: 32
              example: "01001"
            addressLine:
              type: string
              minLength: 1
              maxLength: 128
              example: 1 Example St.
        individual:
          type: object
          properties:
            passportNumber:
              type: string
              maxLength: 32
              example: "123456789"
            phoneNumber:
              type: string
              maxLength: 32
              example: "+380441234567"

    # email is not here: it is the user's login and is not changed by PATCH
    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 64
          example: Ivan
        lastName:
          type: string
          minLength: 1
          maxLength: 64
          example: Petrov-Senior
        address:
          type: object
          properties:
            countryAlpha3:
              type: string
              minLength: 3
              maxLength: 3
              example: UKR
            countryAlpha2:
              type: string
              minLength: 2
              maxLength: 2
              example: UA
            city:
              type: string
              minLength: 1
              maxLength: 64
              example: Lviv
            state:
              type: string
              maxLength: 64
              example: Kyiv
            zipCode:
              type: string
              maxLength: 32
              example: "01001"
            addressLine:
              type: string
              minLength: 1
              maxLength: 128
              example: 1 Example St.
        individual:
          type: object
          properties:
            passportNumber:
              type: string
              maxLength: 32
              example: "123456789"
            phoneNumber:
              type: string
              maxLength: 32
              example: "+380441234567"

    UserResponse:
      type: object
      required: [id, email, firstName, lastName, filled, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: 6c8ec4d0-6fd5-4db8-bf4d-7bcbdb2f6c02
        email:
          type: string
          format: email
          example: ivan.petrov@example.org
        firstName:
          type: string
          example: Ivan
        lastName:
          type: string
          example: Petrov
        filled:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-06-08T10:15:30Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-08T10:15:30Z"
        address:
          type: object
          required: [id, city, addressLine]
          properties:
            id:
              type: string
              format: uuid
              example: 6e6d5e5e-5c7d-4f0e-9f9a-34a0b3f8d101
            countryAlpha3:
              type: string
              example: UKR
            countryAlpha2:
              type: string
              example: UA
            city:
              type: string
              example: Kyiv
            state:
              type: string
              example: Kyiv
            zipCode:
              type: string
              example: "01001"
            addressLine:
              type: string
              example: 1 Example St.
        individual:
          type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
              example: 7fd6212d-0f71-42a0-bf6e-7dbce6cf04fb
            passportNumber:
              type: string
              example: "123456789"
            phoneNumber:
              type: string
              example: "+380441234567"
            status:
              type: string
              example: NEW
            verifiedAt:
              type: string
              format: date-time
              nullable: true
              example: null
            archivedAt:
              type: string
              format: date-time
              nullable: true
              example: null

    # RFC 9457 Problem Details
    ProblemResponse:
      type: object
      description: >
        RFC 9457 problem details. The last four fields are extension members shared by
        the whole course (module 1 uses the same names), so one error body reads the
        same in every service.
      required: [type, title, status, detail, instance, timestamp, error, traceId, details]
      properties:
        type:
          type: string
          format: uri
          example: https://example.org/problems/email-already-exists
        title:
          type: string
          description: Short summary of the HTTP status
          example: Conflict
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
          example: A user with this email already exists
        instance:
          type: string
          example: /api/v1/users
        timestamp:
          type: string
          format: date-time
          example: "2026-06-08T10:15:30Z"
        error:
          type: string
          description: Stable machine-readable error code
          example: EMAIL_ALREADY_EXISTS
        traceId:
          type: string
          description: Correlates the response with the trace stored in Tempo
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        details:
          type: array
          description: Field-level failures, one readable line each; empty otherwise
          items:
            type: string
          example: []

  responses:
    BadRequest:
      description: Invalid format or failed validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    NotFound:
      description: User not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    Conflict:
      description: Email already taken, or the user was changed by someone else meanwhile
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    InternalServerError:
      description: Unexpected error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
