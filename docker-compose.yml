# Local infrastructure for the payment platform.
#
# No image tag, port or credential is written here - they all come from .env,
# so the stack is reproducible and an upgrade is one deliberate edit in one
# file. Copy .env.example to .env before the first run.
#
#   docker compose up -d
#
# Port map lives in CONTEXT.md.

services:

  keycloak-postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${KEYCLOAK_POSTGRES_PORT}:5432"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_IMAGE}
    command: start-dev --import-realm
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      # Renamed in Keycloak 26; the old KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD
      # still work but are deprecated.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./individuals-api/src/main/resources/realm/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PORT}:8080"

  person-postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${PERSON_DB_NAME}
      POSTGRES_USER: ${PERSON_DB_USER}
      POSTGRES_PASSWORD: ${PERSON_DB_PASSWORD}
    ports:
      - "${PERSON_POSTGRES_PORT}:5432"
    volumes:
      - person-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERSON_DB_USER} -d ${PERSON_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  individuals-api:
    build:
      # Root context: Gradle needs settings.gradle.kts, the wrapper, the
      # version catalog and person-client, none of which live in the module.
      context: .
      dockerfile: individuals-api/Dockerfile
    depends_on:
      # service_started, not service_healthy: Keycloak needs a while to finish
      # importing the realm, so the application must tolerate it not answering
      # for the first few seconds after start.
      keycloak:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Defaults to the compose service that arrives in module 2. The
      # walkthrough in docs/DEMO.md overrides it in .env to reach a stub
      # running on the host.
      PERSON_SERVICE_URL: ${PERSON_SERVICE_URL:-http://person-service:8082}
    ports:
      - "${INDIVIDUALS_API_PORT}:8081"

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT}:9090"

  tempo:
    image: ${TEMPO_IMAGE}
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT}:3200"
      - "${TEMPO_OTLP_HTTP_PORT}:4318"

  loki:
    image: ${LOKI_IMAGE}
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT}:3100"

  alloy:
    image: ${ALLOY_IMAGE}
    # run means "start with this config"; the storage path is where Alloy keeps
    # how far it has read each container log, so a restart does not replay
    # everything from the beginning.
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    # The Docker socket is root-owned, and the image runs as an unprivileged
    # user that cannot read it. Acceptable for a local stack only.
    user: root
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only: the agent only ever lists containers and reads their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    image: ${GRAFANA_IMAGE}
    depends_on:
      - prometheus
      - tempo
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"

  # The platform's artifact repository, not a module 1 detail: every service of
  # the course publishes its generated client here and resolves everyone else's
  # by coordinates. That is what lets modules stay independent instead of
  # depending on each other through project(":...").
  #
  # Nothing in this file consumes Nexus at run time - the Gradle build on the
  # host does, at http://localhost:${NEXUS_PORT}. The container's own port stays
  # 8081 internally; only the published one moves, because individuals-api owns
  # 8081 on the host.
  #
  # The three repositories the build expects - maven-releases, maven-snapshots
  # and the maven-public group - exist in a fresh Nexus, so there is nothing to
  # create by hand.
  nexus:
    image: ${NEXUS_IMAGE}
    environment:
      # Known admin password on first start instead of a random one written to
      # a file inside the container. Local development only.
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
      # Nexus asks for 2.7 GB by default, which is more than this stack has to
      # spare next to Keycloak and two databases.
      INSTALL4J_ADD_VM_PARAMS: "-Xms1200m -Xmx1200m -XX:MaxDirectMemorySize=2g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
    volumes:
      - nexus-data:/nexus-data
    ports:
      - "${NEXUS_PORT}:8081"

volumes:
  keycloak-postgres-data:
  person-postgres-data:
  nexus-data:
  tempo-data:
  loki-data:
  alloy-data:
  grafana-data:
