# Local stack of the payment platform. Start it with: make
# Images, ports and passwords come from .env (copy .env.example first).

services:

  keycloak-postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${KEYCLOAK_POSTGRES_PORT}:5432"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_IMAGE}
    command: start-dev --import-realm
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      # Keycloak 26 names (KEYCLOAK_ADMIN* are deprecated)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # /health/ready on the management port 9000, for the healthcheck below
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./individuals-api/src/main/resources/realm/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # healthy only once the realm is imported and HTTP answers, so up --wait
    # really waits. No curl in the image - bash talks to the port directly
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.0 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${KEYCLOAK_PORT}:8080"

  # WireMock stub for person-service until module 2: a new userUid per
  # registration, 409 on a repeat for the Postman users (infra/person-service-stub)
  person-service:
    image: ${WIREMOCK_IMAGE}
    command: ["--port", "8082", "--global-response-templating"]
    volumes:
      - ./infra/person-service-stub:/home/wiremock:ro
    # the image checks port 8080; we listen on 8082, the real service's port
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${PERSON_SERVICE_PORT}:8082"

  person-postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${PERSON_DB_NAME}
      POSTGRES_USER: ${PERSON_DB_USER}
      POSTGRES_PASSWORD: ${PERSON_DB_PASSWORD}
    ports:
      - "${PERSON_POSTGRES_PORT}:5432"
    volumes:
      - person-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERSON_DB_USER} -d ${PERSON_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  individuals-api:
    build:
      # root as context: the build needs gradle/libs.versions.toml;
      # person-client comes from Nexus, so Nexus must be up first (make up)
      context: .
      dockerfile: individuals-api/Dockerfile
      args:
        NEXUS_PUBLIC_URL: http://host.docker.internal:${NEXUS_PORT}/repository/maven-public/
      # host.docker.internal exists on Docker Desktop; this makes it exist on Linux too
      extra_hosts:
        - "host.docker.internal:host-gateway"
    depends_on:
      person-service:
        condition: service_started
      # not service_healthy: the app copes with Keycloak still importing the realm
      keycloak:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # the stub below in module 1, the real service from module 2 on
      PERSON_SERVICE_URL: ${PERSON_SERVICE_URL:-http://person-service:8082}
    ports:
      - "${INDIVIDUALS_API_PORT}:8081"

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # named, or Docker makes an anonymous volume that `volume prune` deletes
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"

  tempo:
    image: ${TEMPO_IMAGE}
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT}:3200"
      - "${TEMPO_OTLP_HTTP_PORT}:4318"

  loki:
    image: ${LOKI_IMAGE}
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT}:3100"

  alloy:
    image: ${ALLOY_IMAGE}
    command:
      - run
      # remembers how far each log was read, so a restart does not replay it all
      - --storage.path=/var/lib/alloy/data
      # its UI shows the log pipeline; 0.0.0.0 so it is reachable from the host
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    ports:
      - "${ALLOY_PORT}:12345"
    # root: needed to read the Docker socket - local stack only
    user: root
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # read-only: Alloy only lists containers and reads their logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    image: ${GRAFANA_IMAGE}
    depends_on:
      - prometheus
      - tempo
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"

  # Artifact repository: person-client is published here, and the
  # individuals-api image build downloads it. Host port 8083, because
  # individuals-api owns 8081.
  nexus:
    image: ${NEXUS_IMAGE}
    environment:
      # known admin password instead of a random one - local only
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
      # less memory than the default 2.7 GB
      INSTALL4J_ADD_VM_PARAMS: "-Xms1200m -Xmx1200m -XX:MaxDirectMemorySize=2g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
    volumes:
      - nexus-data:/nexus-data
    ports:
      - "${NEXUS_PORT}:8081"
    # make up waits for this before the image build; Nexus starts in 1-2 minutes
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/service/rest/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  keycloak-postgres-data:
  person-postgres-data:
  prometheus-data:
  nexus-data:
  tempo-data:
  loki-data:
  alloy-data:
  grafana-data:
