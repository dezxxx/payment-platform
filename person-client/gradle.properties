# person-client: coordinates, toolchain and the Nexus addresses it publishes to.
#
# Every module carries its own copy of these - there is no root build to
# inherit them from. Credentials are never here: they come from the
# environment, as NEXUS_USERNAME / NEXUS_PASSWORD.

group=com.dezxxx
version=1.0.0-SNAPSHOT

# Gradle provisions this JDK regardless of JAVA_HOME.
javaToolchainVersion=25

# Published coordinates. individuals-api resolves exactly these.
personClientGroup=com.dezxxx
personClientArtifact=person-client
personClientVersion=1.0.0-SNAPSHOT

# Nexus. Port 8083, not the default 8081 - individuals-api owns 8081 on the
# host, so Nexus is the one that moves.
nexusReleasesUrl=http://localhost:8083/repository/maven-releases/
nexusSnapshotsUrl=http://localhost:8083/repository/maven-snapshots/
nexusPublicUrl=http://localhost:8083/repository/maven-public/
nexusAllowInsecureProtocol=true

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
