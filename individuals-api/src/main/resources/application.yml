# individuals-api - base configuration.
# Environment variables with local defaults, so it runs from the IDE as is;
# application-docker.yml overrides only the addresses.

spring:
  application:
    # also service.name in the JSON logs
    name: individuals-api
  jackson:
    # no "details": null in error bodies - an absent field instead
    default-property-inclusion: non_null
  reactor:
    # carries traceId/spanId and our MDC fields across thread hops;
    # only exactly "auto" switches it on
    context-propagation: auto
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:payment-platform}

server:
  # fixed by the handout's port map
  port: 8081

# outbound addresses - read only by the clients in gateway
individuals:
  person-service:
    base-url: ${PERSON_SERVICE_URL:http://localhost:8082}
  keycloak:
    base-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:payment-platform}
    client-id: ${KEYCLOAK_CLIENT_ID:individuals-api}
    # comes from .env, never hardcoded
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}

springdoc:
  swagger-ui:
    # our contract, copied into the jar by processResources
    url: /openapi/individuals-api.yaml

management:
  metrics:
    distribution:
      # histogram buckets for the HTTP timer, so Grafana can draw the 95th
      # percentile; only this one meter, buckets cost scrape size
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        # prometheus must be listed, or the scrape gets 404
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # every request is traced - fine locally, not for production
      probability: 1.0
  otlp:
    metrics:
      export:
        # off: Prometheus scrapes our metrics; this OTLP copy would only log
        # a failed push every minute. Traces still go over OTLP
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      # JSON logs in ECS (Elastic Common Schema) format; the request fields
      # come from RequestLogFilter
      console: ecs
