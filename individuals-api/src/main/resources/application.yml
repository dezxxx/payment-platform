spring:
  application:
    name: individuals-api
  web:
    locale: en
    locale-resolver: fixed
  jackson:
    default-property-inclusion: non_null
  reactor:
    # only exactly "auto" switches it on
    context-propagation: auto
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:payment-platform}

server:
  port: 8081

individuals:
  person-service:
    base-url: ${PERSON_SERVICE_URL:http://localhost:8082}
    response-timeout: 30s
  keycloak:
    base-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:payment-platform}
    client-id: ${KEYCLOAK_CLIENT_ID:individuals-api}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  transaction-service:
    base-url: ${TRANSACTION_SERVICE_URL:http://localhost:8084}
  currency-rate-service:
    base-url: ${CURRENCY_RATE_SERVICE_URL:http://localhost:8088}

# one breaker per platform service: 5+ of the last 10 calls failed -> calls are refused at once for 30 s,
# then a single trial call decides; a 4xx is a working service's answer and is not a failure
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        record-failure-predicate: com.dezxxx.individuals.config.DependencyFailurePredicate
    instances:
      person-service:
        base-config: default
      transaction-service:
        base-config: default
      currency-rate-service:
        base-config: default

springdoc:
  swagger-ui:
    url: /openapi/individuals-api.yaml

management:
  metrics:
    distribution:
      # buckets let Grafana draw the 95th percentile; only this meter, they cost scrape size
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        # prometheus must be listed, or the scrape gets 404
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # every request is traced - fine locally, not for production
      probability: 1.0
  otlp:
    metrics:
      export:
        # off: Prometheus scrapes the metrics; an OTLP push would only log failures
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
