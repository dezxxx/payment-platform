spring:
  application:
    name: individuals-api
  jackson:
    # no "details": null in error bodies - an absent field instead
    default-property-inclusion: non_null
  reactor:
    # carries traceId/spanId and our MDC fields across thread hops;
    # only exactly "auto" switches it on
    context-propagation: auto
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:payment-platform}

server:
  port: 8081

individuals:
  person-service:
    base-url: ${PERSON_SERVICE_URL:http://localhost:8082}
  keycloak:
    base-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:payment-platform}
    client-id: ${KEYCLOAK_CLIENT_ID:individuals-api}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}

springdoc:
  swagger-ui:
    url: /openapi/individuals-api.yaml

management:
  metrics:
    distribution:
      # buckets let Grafana draw the 95th percentile; only this meter, they cost scrape size
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        # prometheus must be listed, or the scrape gets 404
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # every request is traced - fine locally, not for production
      probability: 1.0
  otlp:
    metrics:
      export:
        # off: Prometheus scrapes the metrics; an OTLP push would only log failures
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
