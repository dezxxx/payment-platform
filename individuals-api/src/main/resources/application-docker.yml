# Profile "docker": only the addresses change. Inside compose a service is
# reached by its name and container port, not by the host port.

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM:payment-platform}

individuals:
  person-service:
    # the compose service person-service: a WireMock stub in module 1,
    # the real service from module 2 on. PERSON_SERVICE_URL overrides it.
    base-url: ${PERSON_SERVICE_URL:http://person-service:8082}
  keycloak:
    base-url: http://keycloak:8080

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
