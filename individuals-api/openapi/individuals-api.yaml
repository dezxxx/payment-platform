openapi: 3.0.3

info:
  title: individuals-api
  description: |
    External entry layer of the payment platform.

    Orchestrates registration and authentication, and passes wallets and
    transactions to transaction-service with the user taken from the token.
    Owns no domain data:
      - person-service is the source of truth about the domain user
      - Keycloak is the source of truth about the account, tokens and roles
      - transaction-service is the source of truth about wallets and money
  version: 1.0.0
  contact:
    name: dezxxx
    email: web7tudio@gmail.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8081
    description: Local

tags:
  - name: auth
    description: Registration and authentication
  - name: wallets
    description: Wallets of the current user, kept by transaction-service
  - name: transactions
    description: Deposit, withdrawal, transfer of the current user, done by transaction-service

paths:

  /api/v1/auth/registration:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new user
      description: |
        The order is fixed. person-service creates the domain user and issues
        its user_uid - the domain identifier is issued by the domain service,
        never here. The Keycloak account is created next, carrying that
        user_uid as an attribute; its password is set by a second Admin call,
        because the create call does not accept one. The new user is then
        logged in, so no separate login is needed.

        The two systems share no transaction, so a failure is compensated: an
        account created without a password or role is deleted from Keycloak, and
        the domain user is deleted from person-service; the caller gets the
        original error. Only when that delete fails too do the two systems
        disagree, and the answer is REGISTRATION_INCONSISTENT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
            examples:
              valid:
                summary: Well-formed registration
                value:
                  email: user@dezxxx.com
                  password: Str0ngP@ssw0rd
                  confirmPassword: Str0ngP@ssw0rd
                  firstName: Ivan
                  lastName: Ivanov
                  address:
                    countryAlpha3: UKR
                    city: Kyiv
                    zipCode: "01001"
                    addressLine: 1 Example St.
                  individual:
                    passportNumber: "123456789"
                    phoneNumber: "+380441234567"
              mismatchedConfirmation:
                summary: Rejected with 400 - confirmation does not match
                value:
                  email: user@dezxxx.com
                  password: Str0ngP@ssw0rd
                  confirmPassword: Str0ngP@ssw0rt
                  firstName: Ivan
                  lastName: Ivanov
                  address:
                    countryAlpha3: UKR
                    city: Kyiv
                    zipCode: "01001"
                    addressLine: 1 Example St.
                  individual:
                    passportNumber: "123456789"
                    phoneNumber: "+380441234567"
      responses:
        "201":
          description: User registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              examples:
                registered:
                  summary: Tokens issued right after registration
                  value:
                    accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                    expiresIn: 300
                    tokenType: Bearer
                    userUid: 6f1d2a4e-8c3b-4a7f-9e2d-1b5c7a9f0e33
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              valid:
                summary: Known user
                value:
                  email: user@dezxxx.com
                  password: Str0ngP@ssw0rd
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              examples:
                authenticated:
                  value:
                    accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                    expiresIn: 300
                    tokenType: Bearer
                    userUid: 6f1d2a4e-8c3b-4a7f-9e2d-1b5c7a9f0e33
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/refresh-token:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
            examples:
              valid:
                summary: Refresh token issued by a previous login
                value:
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              examples:
                refreshed:
                  value:
                    accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                    expiresIn: 300
                    tokenType: Bearer
                    userUid: 6f1d2a4e-8c3b-4a7f-9e2d-1b5c7a9f0e33
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the currently authenticated user
      description: |
        The profile (email, first and last name) is read from person-service by the
        token's user_uid; roles and emailVerified come from the token, registeredAt
        from Keycloak. An individual person-service no longer finds answers 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
              examples:
                current:
                  summary: Resolved from the bearer token
                  value:
                    userUid: 6f1d2a4e-8c3b-4a7f-9e2d-1b5c7a9f0e33
                    keycloakUserId: 0b7a5f2c-19d4-4a8e-9c3b-77e1a0d4f5b6
                    email: user@dezxxx.com
                    firstName: Ivan
                    lastName: Ivanov
                    emailVerified: false
                    roles: [USER]
                    registeredAt: "2026-08-19T12:34:56Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # Every operation below is passed to transaction-service with X-User-Uid = the token's user_uid;
  # the client never names a user

  /api/v1/wallets:
    post:
      tags: [wallets]
      operationId: createWallet
      summary: Create a wallet of the current user, balance 0
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletRequest"
            examples:
              usd:
                summary: A USD wallet
                value:
                  name: Main USD
                  walletTypeUid: 00000000-0000-0000-0000-000000000840
      responses:
        "201":
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [wallets]
      operationId: getMyWallets
      summary: All wallets of the current user that are not archived; an empty list if none
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallets of the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/wallets/{walletUid}:
    get:
      tags: [wallets]
      operationId: getWalletById
      summary: A wallet of the current user; another user's or an archived wallet is not found
      security:
        - bearerAuth: []
      parameters:
        - name: walletUid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/transactions/deposit/init:
    post:
      tags: [transactions]
      operationId: initDeposit
      summary: Compute the terms of a deposit; nothing is written
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInitRequest"
      responses:
        "200":
          $ref: "#/components/responses/InitTerms"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/transactions/deposit/confirm:
    post:
      tags: [transactions]
      operationId: confirmDeposit
      summary: Create the deposit transaction (PENDING); the provider's answer finishes it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositConfirmRequest"
      responses:
        "200":
          $ref: "#/components/responses/Confirmed"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "409":
          $ref: "#/components/responses/RequestIdConflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ConfirmUnavailable"

  /api/v1/transactions/withdrawal/init:
    post:
      tags: [transactions]
      operationId: initWithdrawal
      summary: Compute the terms of a withdrawal; nothing is written
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInitRequest"
      responses:
        "200":
          $ref: "#/components/responses/InitTerms"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/transactions/withdrawal/confirm:
    post:
      tags: [transactions]
      operationId: confirmWithdrawal
      summary: Debit amount + fee and create the withdrawal transaction (PENDING)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalConfirmRequest"
      responses:
        "200":
          $ref: "#/components/responses/Confirmed"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "409":
          $ref: "#/components/responses/RequestIdConflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ConfirmUnavailable"

  /api/v1/transactions/transfer/init:
    post:
      tags: [transactions]
      operationId: initTransfer
      summary: Compute the terms of a transfer between two wallets of the current user; nothing is written
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInitRequest"
      responses:
        "200":
          $ref: "#/components/responses/InitTerms"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/transactions/transfer/confirm:
    post:
      tags: [transactions]
      operationId: confirmTransfer
      summary: The whole transfer in one transaction; answers COMPLETED
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferConfirmRequest"
      responses:
        "200":
          $ref: "#/components/responses/Confirmed"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "409":
          $ref: "#/components/responses/RequestIdConflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ConfirmUnavailable"

  /api/v1/transactions/{transactionId}/status:
    get:
      tags: [transactions]
      operationId: getTransactionStatus
      summary: Status and details of a transaction of the current user
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatusResponse"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/transactions:
    get:
      tags: [transactions]
      operationId: searchTransactions
      summary: Transactions of the current user by filters, newest first, page by page
      security:
        - bearerAuth: []
      parameters:
        - name: walletUid
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TransactionType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionStatusResponse"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegistrationRequest:
      type: object
      required: [email, password, confirmPassword, firstName, lastName, address, individual]
      # OpenAPI cannot compare two fields; fully qualified because the generator adds no import
      x-class-extra-annotation: "@com.dezxxx.individuals.validation.PasswordsMatch"
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 1024
          example: user@dezxxx.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: Str0ngP@ssw0rd
        confirmPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: Str0ngP@ssw0rd
        firstName:
          type: string
          minLength: 1
          maxLength: 64
          example: Ivan
        lastName:
          type: string
          minLength: 1
          maxLength: 64
          example: Ivanov
        address:
          type: object
          description: The user's address, stored by person-service. Country by ISO 3166-1 code; alpha3 wins when both are sent
          required: [countryAlpha3, city, addressLine]
          properties:
            countryAlpha3:
              type: string
              minLength: 3
              maxLength: 3
              example: UKR
            countryAlpha2:
              type: string
              minLength: 2
              maxLength: 2
              example: UA
            city:
              type: string
              minLength: 1
              maxLength: 64
              example: Kyiv
            state:
              type: string
              maxLength: 64
              example: Kyiv
            zipCode:
              type: string
              maxLength: 32
              example: "01001"
            addressLine:
              type: string
              minLength: 1
              maxLength: 128
              example: 1 Example St.
        individual:
          type: object
          description: Personal data stored by person-service
          required: [passportNumber, phoneNumber]
          properties:
            passportNumber:
              type: string
              minLength: 1
              maxLength: 32
              example: "123456789"
            phoneNumber:
              type: string
              minLength: 1
              maxLength: 32
              example: "+380441234567"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 1024
          example: user@dezxxx.com
        # no minLength: a 400 for a short password would leak the policy
        password:
          type: string
          format: password
          maxLength: 72
          example: Str0ngP@ssw0rd

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType, userUid]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        expiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds
          example: 300
        tokenType:
          type: string
          example: Bearer
        userUid:
          type: string
          format: uuid
          description: The individual's id, issued by person-service
          example: 6f1d2a4e-8c3b-4a7f-9e2d-1b5c7a9f0e33

    CurrentUserResponse:
      type: object
      required: [userUid, keycloakUserId, email, firstName, lastName, emailVerified, roles, registeredAt]
      properties:
        userUid:
          type: string
          format: uuid
          description: The platform identifier - the only one the business layer uses
          example: 6f1d2a4e-8c3b-4a7f-9e2d-1b5c7a9f0e33
        keycloakUserId:
          type: string
          maxLength: 64
          description: |
            Keycloak `sub`. A technical link to the account, never the
            platform's primary identifier.
          example: 0b7a5f2c-19d4-4a8e-9c3b-77e1a0d4f5b6
        email:
          type: string
          format: email
          description: From the individual's profile in person-service
          example: user@dezxxx.com
        firstName:
          type: string
          maxLength: 64
          description: From the individual's profile in person-service - always the current value
          example: Ivan
        lastName:
          type: string
          maxLength: 64
          description: From the individual's profile in person-service - always the current value
          example: Ivanov
        emailVerified:
          type: boolean
          example: false
        roles:
          type: array
          items:
            type: string
          example: [USER]
        registeredAt:
          type: string
          format: date-time
          description: |
            When the account was created in Keycloak. Not present in the access
            token, which is why /me reads the profile through the Admin API
            instead of answering from the token alone.
          example: "2026-08-19T12:34:56Z"

    # The schemas down to TransactionStatus describe transaction-service's models; no classes are
    # generated for them: schemaMappings in build.gradle.kts points them at transaction-service-client

    CreateWalletRequest:
      type: object
      required: [name, walletTypeUid]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          example: Main USD
        walletTypeUid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000840

    WalletResponse:
      type: object
      required: [uid, name, walletTypeUid, currencyCode, status, balance]
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
          example: Main USD
        walletTypeUid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000840
        currencyCode:
          type: string
          example: USD
        status:
          type: string
          example: ACTIVE
        balance:
          type: number
          example: 150.00

    DepositInitRequest:
      type: object
      required: [walletUid, amount]
      properties:
        walletUid:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 100.00

    WithdrawalInitRequest:
      type: object
      required: [walletUid, amount]
      properties:
        walletUid:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 50.00

    TransferInitRequest:
      type: object
      description: The two wallets must differ
      required: [walletUid, targetWalletUid, amount]
      properties:
        walletUid:
          type: string
          format: uuid
        targetWalletUid:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 25.00

    TransactionInitResponse:
      type: object
      required: [amount, fee, total, requestId]
      properties:
        amount:
          type: number
          example: 100.00
        fee:
          type: number
          example: 1.00
        total:
          type: number
          example: 101.00
        requestId:
          type: string
          format: uuid
          description: Send it back in confirm; a repeated confirm with it never charges twice

    DepositConfirmRequest:
      type: object
      required: [requestId, walletUid, amount]
      properties:
        requestId:
          type: string
          format: uuid
        walletUid:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 100.00

    WithdrawalConfirmRequest:
      type: object
      required: [requestId, walletUid, amount]
      properties:
        requestId:
          type: string
          format: uuid
        walletUid:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 50.00

    TransferConfirmRequest:
      type: object
      description: The two wallets must differ
      required: [requestId, walletUid, targetWalletUid, amount]
      properties:
        requestId:
          type: string
          format: uuid
        walletUid:
          type: string
          format: uuid
        targetWalletUid:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 25.00

    TransactionConfirmResponse:
      type: object
      required: [transactionId, status]
      properties:
        transactionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TransactionStatus"

    TransactionStatusResponse:
      type: object
      required: [transactionId, type, status, walletUid, amount, createdAt]
      properties:
        transactionId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TransactionType"
        status:
          $ref: "#/components/schemas/TransactionStatus"
        walletUid:
          type: string
          format: uuid
        targetWalletUid:
          type: string
          format: uuid
        amount:
          type: number
          example: 100.00
        fee:
          type: number
          example: 1.00
        failureReason:
          type: string
          example: INSUFFICIENT_FUNDS_EXTERNAL
        createdAt:
          type: string
          format: date-time

    TransactionType:
      type: string
      enum: [deposit, withdrawal, transfer]

    TransactionStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED]

    ErrorResponse:
      type: object
      required: [timestamp, path, status, error, message, traceId]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-08-19T12:34:56Z"
        path:
          type: string
          example: /api/v1/auth/registration
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          description: Stable machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          example: Password confirmation does not match
        traceId:
          type: string
          description: Correlates the response with the trace stored in Tempo
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        details:
          type: array
          description: Field-level failures, one readable line each
          items:
            type: string
          example:
            - "confirmPassword: must match password"

  responses:
    BadRequest:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationFailed:
              value:
                timestamp: "2026-08-19T12:34:56Z"
                path: /api/v1/auth/registration
                status: 400
                error: VALIDATION_ERROR
                message: Password confirmation does not match
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - "confirmPassword: must match password"
    Unauthorized:
      description: |
        Two different things share this status, and the `error` field is what
        tells them apart: a password was compared and did not match, or no
        usable token was presented at all.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            badCredentials:
              summary: A password was checked and was wrong
              value:
                timestamp: "2026-08-19T12:34:56Z"
                path: /api/v1/auth/login
                status: 401
                error: INVALID_CREDENTIALS
                message: Email or password is incorrect
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
            noToken:
              summary: No token, an expired one, or a path that does not exist
              value:
                timestamp: "2026-08-19T12:34:56Z"
                path: /api/v1/auth/me
                status: 401
                error: AUTHENTICATION_REQUIRED
                message: A valid access token is required
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
            spentRefreshToken:
              summary: The session ended - the refresh token is expired or used
              value:
                timestamp: "2026-08-19T12:34:56Z"
                path: /api/v1/auth/refresh-token
                status: 401
                error: REFRESH_TOKEN_INVALID
                message: Refresh token is expired or no longer valid
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
    Conflict:
      description: User already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            duplicate:
              value:
                timestamp: "2026-08-19T12:34:56Z"
                path: /api/v1/auth/registration
                status: 409
                error: USER_ALREADY_EXISTS
                message: Email is already registered
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: |
        The token is valid, but the account it points at no longer exists in
        Keycloak - deleted, or moved to another realm.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              value:
                timestamp: "2026-08-19T12:34:56Z"
                path: /api/v1/auth/me
                status: 404
                error: NOT_FOUND
                message: Resource not found
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    InternalServerError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unexpected:
              summary: Nothing leaks outwards but the trace id
              value:
                timestamp: "2026-08-19T12:34:56Z"
                path: /api/v1/auth/registration
                status: 500
                error: INTERNAL_ERROR
                message: Unexpected error
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    ServiceUnavailable:
      description: A downstream dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            keycloakDown:
              value:
                timestamp: "2026-08-19T12:34:56Z"
                path: /api/v1/auth/registration
                status: 503
                error: DEPENDENCY_UNAVAILABLE
                message: Keycloak is not reachable
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    InitTerms:
      description: Terms of the operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionInitResponse"
    Confirmed:
      description: Transaction confirmed; a repeated confirm with the same requestId answers the same transaction
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionConfirmResponse"
    TransactionBadRequest:
      description: |
        The request failed validation here or in transaction-service, or
        transaction-service refused the operation; the `error` field names which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationFailed:
              summary: A field is missing or out of range
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/transactions/transfer/init
                status: 400
                error: VALIDATION_ERROR
                message: Request validation failed
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details:
                  - "amount: must be greater than 0"
            insufficientFunds:
              summary: Not enough money including the fee
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/transactions/withdrawal/confirm
                status: 400
                error: INSUFFICIENT_FUNDS
                message: Not enough funds including the fee
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
            currencyMismatch:
              summary: A transfer between wallets of different currencies
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/transactions/transfer/init
                status: 400
                error: CURRENCY_MISMATCH
                message: The wallets have different currencies
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
            walletNotActive:
              summary: The wallet is blocked or archived
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/transactions/deposit/init
                status: 400
                error: WALLET_NOT_ACTIVE
                message: The wallet is not active
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
            walletTypeNotActive:
              summary: The wallet type is archived or not active
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/wallets
                status: 400
                error: WALLET_TYPE_NOT_ACTIVE
                message: The wallet type is archived or not active
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
    TransactionNotFound:
      description: |
        No such wallet, wallet type or transaction among those of the current
        user; another user's wallet is not found either.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            walletNotFound:
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/transactions/deposit/init
                status: 404
                error: WALLET_NOT_FOUND
                message: Wallet not found
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
            walletTypeNotFound:
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/wallets
                status: 404
                error: WALLET_TYPE_NOT_FOUND
                message: Wallet type not found
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
            transactionNotFound:
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/transactions/7c9e6679-7425-40de-944b-e07fc1f90ae7/status
                status: 404
                error: TRANSACTION_NOT_FOUND
                message: Transaction not found
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
    RequestIdConflict:
      description: The requestId was already used for another operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            conflict:
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/transactions/withdrawal/confirm
                status: 409
                error: REQUEST_ID_CONFLICT
                message: requestId already used for another operation
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
    ConfirmUnavailable:
      description: |
        transaction-service did not answer. The operation may already be
        committed: repeat the confirm with the same requestId, or check the
        transaction's status; it is never charged twice.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            transactionServiceDown:
              value:
                timestamp: "2026-10-26T12:34:56Z"
                path: /api/v1/transactions/withdrawal/confirm
                status: 503
                error: DEPENDENCY_UNAVAILABLE
                message: Dependency is not reachable
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                details: []
