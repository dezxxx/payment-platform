# individuals-api: coordinates, toolchain and what it consumes from Nexus.
#
# Every module carries its own copy - there is no root build to inherit them
# from. Credentials come from the environment: NEXUS_USERNAME / NEXUS_PASSWORD.

group=com.dezxxx
version=1.0.0-SNAPSHOT

javaToolchainVersion=25

# person-service-client coordinates, resolved from Nexus (or mavenLocal). Never
# project(":person-service") - modules see each other as artifacts only.
personClientGroup=com.dezxxx
personClientArtifact=person-service-client
personClientVersion=1.0.0-SNAPSHOT

nexusReleasesUrl=http://localhost:8083/repository/maven-releases/
nexusSnapshotsUrl=http://localhost:8083/repository/maven-snapshots/
nexusPublicUrl=http://localhost:8083/repository/maven-public/
nexusAllowInsecureProtocol=true

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
