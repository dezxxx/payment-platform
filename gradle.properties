# ---------------------------------------------------------------------------
# Project coordinates. Every module inherits these; nothing is hardcoded
# in build scripts.
# ---------------------------------------------------------------------------
group=com.dezxxx
version=1.0.0-SNAPSHOT

# Java toolchain. Gradle provisions this JDK regardless of JAVA_HOME.
javaToolchainVersion=25

# ---------------------------------------------------------------------------
# Nexus. person-client is published here and consumed by other modules
# through Maven coordinates - never through project(":person-client").
# Port 8083, not the Nexus default 8081 - individuals-api owns 8081 and the
# course handout fixes that, so Nexus is the one that moves.
# Credentials come from the environment, never from this file.
#   NEXUS_USERNAME / NEXUS_PASSWORD
# ---------------------------------------------------------------------------
nexusReleasesUrl=http://localhost:8083/repository/maven-releases/
nexusSnapshotsUrl=http://localhost:8083/repository/maven-snapshots/
nexusPublicUrl=http://localhost:8083/repository/maven-public/
nexusAllowInsecureProtocol=true

# person-client coordinates resolved from Nexus by individuals-api.
personClientGroup=com.dezxxx
personClientArtifact=person-client
personClientVersion=1.0.0-SNAPSHOT

# ---------------------------------------------------------------------------
# Gradle runtime
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
