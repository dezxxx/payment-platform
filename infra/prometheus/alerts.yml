groups:
  - name: individuals-api
    rules:
      # the breaker stays open: every call to that service is answered 503 without trying
      - alert: DependencyCircuitBreakerOpen
        expr: max by (name) (resilience4j_circuitbreaker_state{job="individuals-api", state="open"}) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "individuals-api cut off {{ $labels.name }}"
          description: "The circuit breaker to {{ $labels.name }} has been open for a minute: its calls are refused with 503 DEPENDENCY_UNAVAILABLE."

  - name: transaction-service
    rules:
      # the provider never answered: the money is neither credited nor returned
      - alert: TransactionPendingTooLong
        expr: transaction_pending_oldest_seconds{job="transaction-service"} > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "A transaction has been PENDING for more than 5 minutes"
          description: "The oldest PENDING transaction is {{ $value | humanizeDuration }} old: the provider did not answer."

      # Kafka does not acknowledge: events pile up in outbox_events
      - alert: OutboxEventsNotSent
        expr: outbox_events_unsent_oldest_seconds{job="transaction-service"} > 60
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Events have been waiting in outbox_events for more than a minute"
          description: "The oldest unsent event is {{ $value | humanizeDuration }} old: Kafka does not acknowledge."

      # every message in a DLT is an answer nobody applied: it needs a person
      - alert: TransactionDeadLetters
        expr: sum by (topic) (increase(transaction_events_dead_letter_total{job="transaction-service"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Messages from {{ $labels.topic }} went to {{ $labels.topic }}-dlt"
          description: "{{ $value | humanize }} messages in the last 5 minutes: the consumer gave up on them after the retries, or at once for an unknown transaction."

      # the consumer falls behind the provider's answers
      - alert: TransactionConsumerLag
        expr: max(kafka_consumer_fetch_manager_records_lag_max{job="transaction-service"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "transaction-service lags behind the provider's answers"
          description: "Up to {{ $value | humanize }} answers are waiting in one partition."

  - name: currency-rate-service
    rules:
      # no update for two hours: one more hour and every rate expires
      - alert: CurrencyRatesTooOld
        expr: rate_newest_age_seconds{job="currency-rate-service"} > 7200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The newest exchange rate is more than 2 hours old"
          description: "The newest rate became valid {{ $value | humanizeDuration }} ago; rates live 3 hours, then cross-currency transfers stop."

      # no valid rate at all: every GET /rates answers 404, every cross-currency transfer 422
      - alert: CurrencyRatesMissing
        expr: max(rate_valid_pairs{job="currency-rate-service"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No currency pair has a valid rate"
          description: "Cross-currency transfers are refused until a rate update succeeds."

      - alert: CurrencyRateUpdateFailed
        expr: sum(increase(rate_updates_total{job="currency-rate-service", result="failure"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "An hourly rate update failed"
          description: "No provider gave valid rates or the write failed; the previous rates stay valid until their rate_end_time."
