# What Prometheus scrapes: individuals-api by its compose name and container
# port. The app must expose /actuator/prometheus (application.yml).

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "individuals-api"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["individuals-api:8081"]
