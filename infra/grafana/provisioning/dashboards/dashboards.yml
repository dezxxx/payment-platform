# Where Grafana finds the dashboard JSON files (mounted by docker-compose.yml).

apiVersion: 1

providers:
  - name: payment-platform
    orgId: 1
    type: file
    disableDeletion: false
    # re-reads the files every 30 s, no restart needed
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
