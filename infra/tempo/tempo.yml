# Tempo: receives OTLP traces over HTTP and stores them on local disk.
#
# The OTLP HTTP receiver listens on 4318, which is what
# management.opentelemetry.tracing.export.otlp.endpoint points at
# (http://tempo:4318/v1/traces).
#
# The endpoint is written out rather than left to the default. Tempo embeds the
# OpenTelemetry receiver, and since collector 0.104 an omitted endpoint means
# localhost, not 0.0.0.0 - inside a container that accepts nothing from outside
# it, so every other service gets "connection refused" while Tempo itself looks
# perfectly healthy on 3200.
#
# Storage paths sit under /var/tempo rather than /tmp, because that is the
# path docker-compose.yml mounts the named volume on. Left at /tmp the traces
# would live inside the container layer and vanish with it, and the volume
# would hold nothing.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces

compactor:
  compaction:
    block_retention: 24h
