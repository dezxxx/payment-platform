# Tempo: receives OTLP traces over HTTP (4318) and keeps them on disk.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          # written out: the default is localhost, which accepts nothing
          # from other containers
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    # /var/tempo is where compose mounts the volume; /tmp would lose traces
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces

ingester:
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 24h
