# Loki: log store for the local stack. One process, files on disk - not
# production shaped, it only has to run on one machine.

# single tenant, so no X-Scope-OrgID header on every push and query
auth_enabled: false

server:
  http_listen_port: 3100
  # Loki's own INFO lines would drown ours
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # v13 + tsdb: the current schema
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # lets Alloy attach traceId to a line without making it a label
  allow_structured_metadata: true
  retention_period: 24h
  # a restart replays old container logs - accept them instead of rejecting
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
